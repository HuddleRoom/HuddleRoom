name: standard_dev_escalation
description: >
  Standard escalation chain for development protocols (code_review, feature_development, bug_fix).
  Three steps: peer review, pair session with senior agent, human notification.

steps:
  - step: 1
    label: "Peer pair session"
    timeout: 2h
    action: pair_session
    participants:
      - role: reviewer
      - role: developer
    message_template: >
      Protocol {{protocol_instance.id}} ({{protocol_name}}) is stuck in state
      {{current_state}}. A pair session has been scheduled. Please join to
      unblock: {{pair_session_link}}.
    on_timeout: next_step

  - step: 2
    label: "PM + stuck actor meeting"
    timeout: 4h
    action: meeting
    participants:
      - role: pm
      - role: developer
      - role: reviewer
    message_template: >
      Protocol {{protocol_name}} on {{task.title}} has been stuck for over 2h.
      A meeting has been called with PM to resolve the blockage.
    on_timeout: next_step

  - step: 3
    label: "Human intervention required"
    timeout: 8h
    action: human_notify
    participants:
      - kind: human
    message_template: >
      ATTENTION REQUIRED: Protocol {{protocol_name}} on {{task.title}} has failed
      to self-resolve through automated escalation. Current state: {{current_state}}.
      Reason: {{timeout_reason}}. Please review and intervene at:
      {{dashboard_url}}/protocol-instances/{{protocol_instance.id}}
    on_timeout: fail

terminal_action_on_fail: >
  Protocol instance marked FAILED. Task {{task.id}} transitioned to blocked
  with reason: escalation_exhausted. Human must manually resolve.
